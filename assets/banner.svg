<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The Bonobo Code">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#FF1493" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FE53BB"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#000000"/>
  <rect x="6" y="6" width="1188" height="288" rx="14" fill="none" stroke="#FF1493" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="6" fill="#FE53BB" filter="url(#glow)">THE BONOBO CODE</text>
  <rect x="200" y="182" width="800" height="3" fill="url(#line)"/>
  <text x="600" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="3" fill="#FF1493">FEMALE NETWORKS  ·  COALITION  ·  COLLECTIVE POWER</text>
  <text x="600" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2" fill="#ffffff" fill-opacity="0.75">a research notebook — hypotheses tested, not assumed</text>
</svg>
