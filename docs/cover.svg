<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="t s">
  <title id="t">The Bonobo Code</title>
  <desc id="s">Book cover: The Bonobo Code, Women’s Secret to Heaven on Earth</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#7a0a45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="#000"/>
  <rect width="1200" height="1800" fill="url(#glow)"/>

  <!-- Spiral motif: a stylized double helix, the "code" -->
  <g fill="none" stroke="#FE53BB" stroke-width="6" filter="url(#neon)" opacity="0.9">
    <path d="M300 520 C 450 420, 750 620, 900 520"/>
    <path d="M300 600 C 450 500, 750 700, 900 600"/>
    <path d="M300 680 C 450 580, 750 780, 900 680"/>
    <path d="M300 760 C 450 660, 750 860, 900 760"/>
    <path d="M300 840 C 450 740, 750 940, 900 840"/>
  </g>
  <g fill="#FF1493" filter="url(#neon)">
    <circle cx="300" cy="520" r="10"/><circle cx="900" cy="520" r="10"/>
    <circle cx="300" cy="680" r="10"/><circle cx="900" cy="680" r="10"/>
    <circle cx="300" cy="840" r="10"/><circle cx="900" cy="840" r="10"/>
  </g>

  <text x="600" y="1080" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="132" letter-spacing="10" fill="#FE53BB" filter="url(#neon)">THE BONOBO</text>
  <text x="600" y="1240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="132" letter-spacing="10" fill="#FE53BB" filter="url(#neon)">CODE</text>

  <line x1="300" y1="1310" x2="900" y2="1310" stroke="#FF1493" stroke-width="3"/>

  <text x="600" y="1400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58"
        fill="#f5e9f0">Women’s Secret to</text>
  <text x="600" y="1475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58"
        fill="#f5e9f0">Heaven on Earth</text>

  <text x="600" y="1700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30"
        letter-spacing="6" fill="#b58ba3">A BOOK IN PROGRESS</text>
</svg>
